<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Faça login no CINEBOOKS para acessar seus filmes, séries e livros favoritos.">
  <title>CINEBOOKS | Entrar</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=20260924d">
  <script src="js/i18n.js?v=20260924d" defer></script>
  <script src="js/auth.js?v=20260924d"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060d17">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineBook">
  <script src="js/pwa.js?v=20260924d" defer></script>
  <style>
    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-color: #0b0f1d;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* HEADER MODERNO COM GLASSMORPHISM & GRADIENTE */
    .cine-header {
      height: 60px;
      min-height: 60px;
      background: rgba(11, 15, 29, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(139, 92, 246, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .cine-nav-left {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }

    .cine-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .cine-logo:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.6));
    }

    .cine-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #0d1222;
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .cine-logo-icon img, .cine-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
      display: block;
    }

    .cine-logo-text {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .logo-cine {
      background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-books {
      background: linear-gradient(135deg, #38bdf8 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cine-nav-links {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cine-nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .cine-nav-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .cine-nav-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    /* DROPDOWN DE IDIOMAS */
    .lang-selector-container {
      position: relative;
    }

    .cine-lang-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.38rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .cine-lang-badge:hover {
      color: #ffffff;
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.15);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }

    .lang-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(13, 17, 33, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 12px;
      padding: 0.45rem;
      display: none;
      flex-direction: column;
      min-width: 190px;
      max-height: 380px;
      overflow-y: auto;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 92, 246, 0.2);
      z-index: 1000;
      scrollbar-width: thin;
      scrollbar-color: rgba(139, 92, 246, 0.5) transparent;
    }

    .lang-dropdown-menu::-webkit-scrollbar {
      width: 6px;
    }

    .lang-dropdown-menu::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
      border-radius: 4px;
    }

    .lang-dropdown-menu::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    .lang-dropdown-menu.open {
      display: flex;
      animation: dropdownFade 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes dropdownFade {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lang-flag-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .lang-flag-img {
      width: 20px;
      height: 14px;
      object-fit: cover;
      border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: block;
    }

    .lang-option-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0.85rem;
      color: #cbd5e1;
      font-size: 0.86rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .lang-option-item:hover {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.25) 0%, rgba(99, 102, 241, 0.15) 100%);
      color: #ffffff;
      transform: translateX(4px);
    }

    .lang-option-item.active {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #a78bfa;
      font-weight: 700;
    }

    .lang-option-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lang-check-icon {
      margin-left: auto;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 800;
    }

    .cine-search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .cine-search-icon {
      position: absolute;
      left: 0.85rem;
      color: #64748b;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .cine-search-box {
      background: rgba(18, 24, 43, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 0.45rem 1rem 0.45rem 2.25rem;
      color: #ffffff;
      font-size: 0.85rem;
      width: 200px;
      outline: none;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .cine-search-box:focus {
      width: 240px;
      border-color: #8b5cf6;
      background: rgba(18, 24, 43, 0.95);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.35);
    }

    .cine-lang-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cine-lang-badge:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .cine-auth-link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .cine-auth-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .cine-auth-btn-pill {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.48rem 1.15rem;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
      border: none;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cine-auth-btn-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
      background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
      color: #ffffff;
    }

    .cine-main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      max-height: calc(100vh - 60px);
      overflow: hidden;
      background-color: #0b0f1d;
    }

    .cine-form-column {
      width: 430px;
      min-width: 390px;
      padding: 1.5rem 2.25rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
      height: 100%;
    }

    .cine-eyebrow {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #8b5cf6;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .cine-main-title {
      font-size: 1.95rem;
      font-weight: 800;
      line-height: 1.18;
      color: #ffffff;
      margin: 0 0 0.45rem 0;
      letter-spacing: -0.5px;
    }

    .cine-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 1.25rem 0;
    }

    .cine-form {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .cine-input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .cine-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .cine-input-field {
      background-color: #12182b;
      border: 1px solid #1e293b;
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .cine-input-field:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.35);
    }

    .cine-submit-btn {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      background: transparent;
      border: 1.5px solid #7c3aed;
      color: #c4b5fd;
      border-radius: 7px;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .cine-submit-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.55);
    }

    .cine-login-prompt {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-top: 0.85rem;
    }

    .cine-login-prompt a {
      color: #a78bfa;
      text-decoration: underline;
      font-weight: 600;
    }

    /* COLUNA DIREITA: MURAL DE PÔSTERES COM ANIMAÇÃO SUAVE */
    .cine-poster-wall-column {
      flex: 1;
      height: 100%;
      padding: 1rem 2rem 1rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .poster-mosaic-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    .poster-mosaic-col {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100%;
      will-change: transform;
    }

    .poster-mosaic-col:nth-child(1) {
      animation: subtleFloat1 7s ease-in-out infinite, entranceFade 0.6s ease-out 0.1s backwards;
    }
    .poster-mosaic-col:nth-child(2) {
      animation: subtleFloat2 8s ease-in-out infinite 0.5s, entranceFade 0.6s ease-out 0.2s backwards;
    }
    .poster-mosaic-col:nth-child(3) {
      animation: subtleFloat1 7.5s ease-in-out infinite 1s, entranceFade 0.6s ease-out 0.3s backwards;
    }
    .poster-mosaic-col:nth-child(4) {
      animation: subtleFloat2 8.5s ease-in-out infinite 1.5s, entranceFade 0.6s ease-out 0.4s backwards;
    }
    .poster-mosaic-col:nth-child(5) {
      animation: subtleFloat1 7s ease-in-out infinite 2s, entranceFade 0.6s ease-out 0.5s backwards;
    }

    @keyframes subtleFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes subtleFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    @keyframes entranceFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .poster-mosaic-item {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      background-color: #12182b;
      height: 100%;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.35s ease, border-color 0.35s ease;
      cursor: pointer;
    }

    .poster-mosaic-item:hover {
      transform: scale(1.05) translateY(-4px);
      box-shadow: 0 16px 36px rgba(124, 58, 237, 0.45);
      border-color: rgba(167, 139, 250, 0.6);
      z-index: 10;
    }

    .poster-mosaic-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .poster-mosaic-item:hover .poster-mosaic-img {
      transform: scale(1.08);
    }

    .cine-error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      display: none;
      margin-bottom: 0.35rem;
    }

    @media (max-width: 1050px) {
      html, body {
        height: auto !important;
        max-height: none !important;
        overflow-y: auto !important;
      }
      .cine-main-layout {
        height: auto !important;
        min-height: calc(100vh - 60px);
        overflow-y: visible !important;
      }
      .cine-poster-wall-column { display: none; }
      .cine-form-column { width: 100%; max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- ================= HEADER MODERNO GLASSMORPHIC ================= -->
  <header class="cine-header">
    <div class="cine-nav-left">
      <a href="index.html" class="cine-logo" title="Voltar ao Início">
        <div class="cine-logo-icon">
          <img src="assets/logo.png" alt="CINEBOOKS Logo" class="cine-logo-img">
        </div>
        <span class="cine-logo-text"><span class="logo-cine">CINE</span> <span class="logo-books">BOOKS</span></span>
      </a>
      <nav class="cine-nav-links">
        <a href="index.html?tab=movie" class="cine-nav-link" data-i18n="nav_movies">Filmes</a>
        <a href="index.html?tab=series" class="cine-nav-link" data-i18n="nav_series">Séries</a>
        <a href="index.html?tab=book" class="cine-nav-link" data-i18n="nav_books">Livros</a>
        <a href="index.html?tab=people" class="cine-nav-link" data-i18n="nav_people">Pessoas</a>
      </nav>
    </div>

    <div class="cine-nav-right">
      <!-- Seletor de Idiomas Dropdown -->
      <div class="lang-selector-container">
        <div class="cine-lang-badge" id="langSelectorTrigger" title="Alterar Idioma / Change Language / Cambiar Idioma">
          <span id="currentLangFlag" class="lang-flag-box"><img src="https://flagcdn.com/w40/br.png" srcset="https://flagcdn.com/w80/br.png 2x" alt="Português" class="lang-flag-img"></span> <span id="currentLangText">PT</span> <span style="font-size: 0.65rem; opacity: 0.7;">▼</span>
        </div>
        <div class="lang-dropdown-menu" id="langDropdownMenu">
          <!-- Preenchido dinamicamente via i18n.js -->
        </div>
      </div>
      
      <a href="login.html" class="cine-auth-link" style="color: #ffffff; font-weight: 700; background: rgba(255,255,255,0.06);" data-i18n="auth_login">Entrar</a>
      <a href="cadastro.html" class="cine-auth-btn-pill" data-i18n="auth_register">Criar conta</a>
    </div>
  </header>

  <!-- ================= LAYOUT PRINCIPAL (ZERO SCROLL) ================= -->
  <main class="cine-main-layout">
    
    <!-- COLUNA 1: FORMULÁRIO DE LOGIN -->
    <section class="cine-form-column">
      <div class="cine-eyebrow" data-i18n="login_eyebrow">— ENTRAR NA CONTA</div>
      <h1 class="cine-main-title" data-i18n="login_title">Bem-vindo de volta ao seu catálogo</h1>
      <p class="cine-subtitle" data-i18n="login_subtitle">Acesse sua estante personalizada de filmes, séries e livros.</p>

      <div class="cine-error-box" id="loginErrorBox"></div>

      <form class="cine-form" id="cineLoginForm">
        
        <div class="cine-input-group">
          <label class="cine-label" for="loginEmailInput" data-i18n="label_login_identifier">E-mail ou Usuário</label>
          <input 
            type="text" 
            id="loginEmailInput" 
            class="cine-input-field" 
            placeholder="ex: usuario ou email@exemplo.com" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="cine-input-group">
          <label class="cine-label" for="loginPasswordInput" data-i18n="label_password">Senha</label>
          <input 
            type="password" 
            id="loginPasswordInput" 
            class="cine-input-field" 
            placeholder="Digite sua senha..." 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="cine-submit-btn" data-i18n="btn_login">
          Entrar
        </button>

        <div class="cine-login-prompt">
          <span data-i18n="prompt_no_account">Não tem conta?</span> <a href="cadastro.html" data-i18n="auth_register">Criar conta</a>
        </div>
      </form>
    </section>

    <!-- COLUNA 2: MURAL DE PÔSTERES (DESTAQUES DA SEMANA) -->
    <section class="cine-poster-wall-column" aria-label="Destaques da Semana">
      <div class="poster-mosaic-grid">
        
        <!-- Coluna 1: Duna 2 (Filme) + The Last of Us (Série) -->
        <div class="poster-mosaic-col">
          <div class="poster-mosaic-item" title="Duna: Parte 2 (Filme Destaque)">
            <img 
              src="https://image.tmdb.org/t/p/w500/zjuI52fmUS1YGMQm53UYTTgOg0K.jpg" 
              alt="Duna: Parte 2" 
              class="poster-mosaic-img"
              onerror="this.onerror=null; this.src='https://image.tmdb.org/t/p/w500/zjuI52fmUS1YGMQm53UYTTgOg0K.jpg';"
            >
          </div>
          <div class="poster-mosaic-item" title="The Last of Us (Série Destaque)">
            <img 
              src="https://image.tmdb.org/t/p/w500/dmo6TYuuJgaYinXBPjrgG9mB5od.jpg" 
              alt="The Last of Us" 
              class="poster-mosaic-img"
              onerror="this.onerror=null; this.src='https://image.tmdb.org/t/p/w500/dmo6TYuuJgaYinXBPjrgG9mB5od.jpg';"
            >
          </div>
        </div>

        <!-- Coluna 2: Oppenheimer (Filme) + Duna - Livro (Edição Definitiva) -->
        <div class="poster-mosaic-col">
          <div class="poster-mosaic-item" title="Oppenheimer (Filme Destaque)">
            <img 
              src="https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" 
              alt="Oppenheimer" 
              class="poster-mosaic-img"
              onerror="this.onerror=null; this.src='https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg';"
            >

  <script>
    const apiBaseUrl = window.location.origin.includes('localhost:8000') || window.location.origin.includes('127.0.0.1:8000') 
      ? window.location.origin 
      : 'http://localhost:8000';

    const form = document.getElementById('cineLoginForm');
    const errorBox = document.getElementById('loginErrorBox');

    const submitBtn = form.querySelector('button[type="submit"]');
    const nextPage = CineAuth.safeNextPage(new URLSearchParams(location.search).get('next'));

    function showLoginError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginEmailInput').value.trim();
      const password = document.getElementById('loginPasswordInput').value;

      errorBox.style.display = 'none';

      // 1. Backend Python (só quando o site está sendo servido por ele, em
      //    localhost:8000). Em qualquer outro endereço a senha nunca é enviada
      //    para "localhost" — lá pode estar rodando outro programa qualquer.
      if (apiBaseUrl === window.location.origin) try {
        const response = await fetch(`${apiBaseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: identifier, password })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          CineAuth.setSession(data.user);
          window.location.href = nextPage;
          return;
        } else if (response.status === 401 || (data && data.error)) {
          // O backend respondeu explicitamente que as credenciais são inválidas
          errorBox.textContent = data.error || 'Usuário ou senha incorretos.';
          errorBox.style.display = 'block';
          return;
        }
      } catch (err) {
        console.warn("Backend offline, verificando registro local de usuários...");
      }

      // 2. Contas deste navegador (senha conferida por hash, nunca em texto)
      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = 'Entrando...';
      try {
        await CineAuth.ready;
        const result = await CineAuth.login(identifier, password);
        if (!result.ok) {
          showLoginError(result.error);
          return;
        }
        CineAuth.setSession(result.user);
        window.location.href = nextPage;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    });
  </script>
